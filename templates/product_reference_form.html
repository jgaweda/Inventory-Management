{% extends "base.html" %}
{% block title %}{{ 'Edit' if ref else 'Add' }} Product Reference{% endblock %}

{% block content %}
<div style="margin-bottom: 24px;">
    <a href="{{ url_for('product_reference_list') }}" style="color: var(--text-muted); font-size: 13px; text-decoration: none;">&larr; Back to Product Reference</a>
</div>

<h2 style="font-size: 24px; font-weight: 700; margin-bottom: 24px;">{{ 'Edit' if ref else 'Add' }} Product Reference</h2>

<form method="POST" style="max-width: 600px;">
    <div class="card" style="cursor: default;">
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">
                    Codename <span style="color: var(--accent-red);">*</span>
                </label>
                <input type="text" name="codename" value="{{ ref.codename if ref else '' }}" required placeholder="e.g. Marconi">
            </div>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 16px;">
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Model Name</label>
                    <input type="text" name="model_name" value="{{ ref.model_name if ref else '' }}" placeholder="e.g. HP OfficeJet Pro 9120 Series">
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Variant</label>
                    <select name="variant">
                        <option value="">None</option>
                        <option value="Base" {% if ref and ref.variant == 'Base' %}selected{% endif %}>Base</option>
                        <option value="Plus" {% if ref and ref.variant == 'Plus' %}selected{% endif %}>Plus</option>
                        <option value="Lite" {% if ref and ref.variant == 'Lite' %}selected{% endif %}>Lite</option>
                    </select>
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Wi-Fi Gen</label>
                    <input type="text" name="wifi_gen" value="{{ ref.wifi_gen if ref else '' }}" placeholder="e.g. 5, 6, 6E">
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Year</label>
                    <input type="text" name="year" value="{{ ref.year if ref else '' }}" placeholder="e.g. 2024">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Wireless Chipset Manufacturer</label>
                    <input type="text" name="chip_manufacturer" value="{{ ref.chip_manufacturer if ref else '' }}" placeholder="e.g. Realtek, Infineon, TI">
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Wireless Chipset Codename</label>
                    <input type="text" name="chip_codename" value="{{ ref.chip_codename if ref else '' }}" placeholder="e.g. Stingray, Stellar">
                </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">FW Codebase</label>
                    <input type="text" name="fw_codebase" value="{{ ref.fw_codebase if ref else '' }}" placeholder="e.g. Dune, SoL, Phoenix">
                </div>
                <div>
                    <label style="font-size: 12px; font-weight: 600; color: var(--text-secondary); display: block; margin-bottom: 6px;">Print Technology</label>
                    <select name="print_technology">
                        <option value="">Select...</option>
                        <option value="Ink" {% if ref and ref.print_technology == 'Ink' %}selected{% endif %}>Ink</option>
                        <option value="Laser" {% if ref and ref.print_technology == 'Laser' %}selected{% endif %}>Laser</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 16px;">
        <button type="submit" class="btn btn-primary">{{ 'Save Changes' if ref else 'Add Product' }}</button>
        <a href="{{ url_for('product_reference_list') }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
