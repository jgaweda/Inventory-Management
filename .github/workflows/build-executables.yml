name: Build Executables

on:
  push:
    branches:
      - ims-app
    paths-ignore:
      - 'VERSION'        # Don't re-trigger on version bump commits
  schedule:
    - cron: '0 5 * * *'  # Run daily at midnight EST (5:00 UTC)
  workflow_dispatch:      # Allow manual trigger from GitHub UI

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ims-app
          fetch-depth: 0
      - name: Check for commits in the last 24 hours
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Non-scheduled trigger — building"
          else
            RECENT=$(git log --since="24 hours ago" --oneline | head -1)
            if [ -n "$RECENT" ]; then
              echo "should_build=true" >> $GITHUB_OUTPUT
              echo "Found recent commits — building"
            else
              echo "should_build=false" >> $GITHUB_OUTPUT
              echo "No commits in last 24h — skipping build"
            fi
          fi

  bump-version:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ims-app
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump patch version
        id: bump
        run: |
          CURRENT=$(cat VERSION | tr -d '[:space:]')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "$NEW_VERSION" > VERSION
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped version: $CURRENT -> $NEW_VERSION"
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to v${{ steps.bump.outputs.version }} [skip ci]"
          git push origin ims-app

  build-windows:
    needs: [check-changes, bump-version]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ims-app

      - name: Set up Python 3.8 (Windows 7 compatible)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_win7.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --clean scripts/inventory.spec

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: InventorySystem-Windows
          path: dist/InventorySystem/

  build-macos:
    needs: [check-changes, bump-version]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ims-app

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller --clean scripts/inventory.spec

      - name: Ad-hoc code sign (prevents Gatekeeper quarantine errors)
        run: |
          find dist/InventorySystem/ -type f \( -name "*.so" -o -name "*.dylib" -o -perm +111 \) -exec codesign --force --sign - {} \;

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: InventorySystem-macOS
          path: dist/InventorySystem/

  release:
    needs: [bump-version, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ims-app

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: InventorySystem-Windows
          path: InventorySystem-Windows/

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: InventorySystem-macOS
          path: InventorySystem-macOS/

      - name: Zip builds
        run: |
          cd InventorySystem-Windows && zip -r ../InventorySystem-Windows.zip . && cd ..
          cd InventorySystem-macOS && zip -r ../InventorySystem-macOS.zip . && cd ..

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.bump-version.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)

          gh release create "$VERSION" \
            InventorySystem-Windows.zip InventorySystem-macOS.zip \
            --title "$VERSION" \
            --notes "**Version:** $VERSION
          **Built:** $DATE
          **Commit:** \`$SHORT_SHA\` — $COMMIT_MSG

          ### Downloads
          - **InventorySystem-macOS.zip** — macOS 12+ (Apple Silicon)
          - **InventorySystem-Windows.zip** — Windows 7+

          Unzip and run. See [README](../../blob/ims-app/README.md) for setup instructions."
